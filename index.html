<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คืนนี้ฝนตกอีกแล้วนะ...</title>
    <!-- Google Fonts: Prompt สำหรับ UI ทั่วไป และ Sarabun / Caveat สำหรับข้อความลายมือ -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Prompt:wght@300;400;500&family=Sarabun:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #04060b;
            font-family: 'Prompt', sans-serif;
            color: #e2e8f0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mobile First Window Frame Container (Ratio 9:16) */
        #app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 880px;
            background: #090d16;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 424px) {
            #app-container {
                border-radius: 36px;
                border: 10px solid #1f2430;
                height: 92vh;
            }
        }

        /* --- CINEMATIC WINDOW FRAME BORDER --- */
        .window-frame-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 14px solid #181d28;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 40;
            display: flex;
            justify-content: space-between;
        }
        /* หน้าต่างจำลองแบ่งช่องซ้ายขวา/กลาง */
        .window-pane-divider-v {
            width: 6px;
            height: 100%;
            background: #181d28;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
            margin: 0 auto;
        }

        /* Film Grain & Vignette */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.05"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 35;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 36;
        }

        /* Canvas สำหรับฝนและเอฟเฟกต์ละอองแสง */
        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* World Scene (ภายในกรอบหน้าต่าง) */
        .world-scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #0b1021 0%, #161e38 50%, #1f1b2e 100%);
            transition: background 2s ease;
            z-index: 2;
        }

        .world-scene.sunset {
            background: linear-gradient(180deg, #2c162d 0%, #613033 40%, #a8583c 80%, #d49157 100%);
        }

        /* Background Illustration Layers (CSS Vector art) */
        .sky-bg { position: absolute; width: 100%; height: 60%; top: 0; left: 0; }
        .city-silhouette {
            position: absolute; bottom: 15%; left: 0; width: 100%; height: 50%;
            background: 
                linear-gradient(0deg, #0c1122 0%, transparent 100%),
                repeating-linear-gradient(90deg, transparent, transparent 35px, #10162a 35px, #10162a 70px);
            z-index: 3;
        }
        .road-reflection {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 25%;
            background: linear-gradient(180deg, #0d1222 0%, #060913 100%);
            border-top: 1px solid rgba(246, 173, 85, 0.2);
            z-index: 4;
        }

        /* --- INTERACTIVE OBJECTS (HOTSPOTS) --- */
        .interactive-obj {
            position: absolute;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .interactive-obj:hover {
            transform: scale(1.08);
        }
        .interactive-obj:active {
            transform: scale(0.95);
        }

        /* Glowing Pulse Hint สำหรับวัตถุกดได้ */
        .pulse-glow {
            animation: objectGlow 2.5s infinite ease-in-out;
        }
        @keyframes objectGlow {
            0%, 100% { filter: drop-shadow(0 0 3px rgba(246,173,85,0.4)); }
            50% { filter: drop-shadow(0 0 10px rgba(246,173,85,0.9)); }
        }

        /* --- DIALOGUE / STORY OVERLAY BOX --- */
        .story-hud {
            position: absolute;
            bottom: 30px;
            left: 24px;
            right: 24px;
            background: rgba(12, 16, 28, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 16px 20px;
            border-radius: 16px;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.1, 0.9, 0.2, 1);
            pointer-events: none;
        }
        .story-hud.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .story-hud-text {
            font-family: 'Sarabun', sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f5f9;
            text-align: center;
            min-height: 45px;
        }
        .story-hud-next {
            display: block;
            margin: 10px auto 0 auto;
            background: none;
            border: none;
            color: #f6ad55;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        /* --- MODAL POPUPS (POLAROID & LETTER) --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 6, 11, 0.8);
            backdrop-filter: blur(8px);
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Polaroid Card */
        .polaroid-card {
            background: #fdfbf7;
            padding: 16px 16px 42px 16px;
            width: 270px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            transform: scale(0.7) rotate(-6deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            color: #2d3748;
            text-align: center;
        }
        .modal-overlay.show .polaroid-card {
            transform: scale(1) rotate(-2.5deg);
        }
        .polaroid-card::before {
            content: '';
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 70px; height: 22px;
            background: rgba(255, 255, 255, 0.65);
            border-left: 2px dashed rgba(0,0,0,0.15);
            border-right: 2px dashed rgba(0,0,0,0.15);
        }
        .polaroid-img-box {
            width: 100%; height: 190px;
            background: #232d42;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            position: relative;
        }
        .polaroid-caption {
            margin-top: 14px;
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #4a5568;
        }

        /* Letter Envelope Container */
        .letter-modal-box {
            width: 310px;
            background: #f4eee1;
            padding: 30px 22px;
            border-radius: 4px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            color: #2c2c2c;
            font-family: 'Sarabun', sans-serif;
            position: relative;
            transform: translateY(40px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        .modal-overlay.show .letter-modal-box {
            transform: translateY(0);
            opacity: 1;
        }
        .letter-content {
            font-size: 1.05rem;
            line-height: 1.9;
            white-space: pre-line;
            min-height: 160px;
        }

        /* --- INTRO SCREEN & START BUTTON --- */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 10, 19, 0.92);
            z-index: 70;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            transition: opacity 0.8s ease;
        }
        #intro-screen.hide {
            opacity: 0;
            pointer-events: none;
        }
        .glow-btn {
            background: linear-gradient(135deg, #f6ad55, #ed8936);
            color: #111827;
            border: none;
            padding: 14px 36px;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(237, 137, 54, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 25px;
        }
        .glow-btn:active {
            transform: scale(0.95);
        }

        /* Progress tracker บนมุมขวา */
        .story-progress {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            z-index: 45;
            backdrop-filter: blur(4px);
        }

        /* Audio toggle button มุมซ้ายบน */
        .audio-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            z-index: 45;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Film Grain & Vignette Effects -->
        <div class="grain-overlay"></div>
        <div class="vignette"></div>

        <!-- Rain Canvas -->
        <canvas id="rainCanvas"></canvas>

        <!-- Audio Ambience Toggle -->
        <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()">🔊 เสียงฝน</button>

        <!-- Progress Indicator -->
        <div class="story-progress" id="progressIndicator">ความทรงจำ 0/4</div>

        <!-- --- INTRO START SCREEN --- -->
        <div id="intro-screen">
            <p style="font-family: 'Sarabun', sans-serif; font-size: 1.35rem; color: #cbd5e1; margin-bottom: 12px; line-height: 1.8;">
                "คืนนี้ฝนตกอีกแล้วนะ..."
            </p>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 30px; font-weight: 300;">
                มองผ่านหน้าต่างความทรงจำออกไปสิ มีบางสิ่งซ่อนอยู่
            </p>
            <button class="glow-btn" onclick="startStory()">เปิดหน้าต่างสำรวจ</button>
        </div>

        <!-- --- WORLD SCENE (มองผ่านกรอบหน้าต่าง) --- -->
        <div class="world-scene" id="worldScene">
            <div class="sky-bg"></div>
            <div class="city-silhouette"></div>
            <div class="road-reflection"></div>

            <!-- Interactive Object 1: หน้าต่างห้องอุ่นๆ (ซ้ายบน) -->
            <div class="interactive-obj pulse-glow" style="top: 22%; left: 18%; width: 55px; height: 75px; background: rgba(246,173,85,0.35); border-radius: 4px; border: 1px solid #f6ad55;" onclick="triggerObject('window')">
                <div style="font-size: 9px; color: #f6ad55; position: absolute; bottom: -18px; left: -2px; width: 70px; text-align: center;">หน้าต่างห้อง</div>
            </div>

            <!-- Interactive Object 2: ร้านกาแฟ (ขวาบน) -->
            <div class="interactive-obj pulse-glow" style="top: 32%; right: 18%; width: 65px; height: 50px; background: rgba(237,137,54,0.25); border-radius: 6px; border: 1px solid #ed8936; display: flex; align-items: center; justify-content: center;" onclick="triggerObject('cafe')">
                <span style="font-size: 9px; color: #ed8936; font-weight: 500;">ร้านกาแฟ</span>
            </div>

            <!-- Interactive Object 3: แก้วกาแฟริมหน้าต่าง (ตรงกลางล่าง) -->
            <div class="interactive-obj pulse-glow" style="bottom: 22%; left: 30%; width: 35px; height: 35px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center;" onclick="triggerObject('coffee')">
                <span style="font-size: 14px;">☕</span>
            </div>

            <!-- Interactive Object 4: ซองจดหมายเก่าบนถนน (กลางล่าง) -->
            <div class="interactive-obj pulse-glow" style="bottom: 12%; right: 32%; width: 45px; height: 30px; background: #f4eee1; border-radius: 3px; box-shadow: 0 0 10px rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center;" onclick="triggerObject('letter')">
                <span style="font-size: 8px; color: #333; font-weight: bold;">💌 จดหมาย</span>
            </div>
        </div>

        <!-- --- STORY HUD DIALOGUE BOX --- -->
        <div class="story-hud" id="storyHud">
            <div class="story-hud-text" id="hudText">ข้อความเรื่องราว...</div>
            <button class="story-hud-next" onclick="closeHud()">แตะเพื่อปิดหรือสำรวจต่อ ➔</button>
        </div>

        <!-- --- MODAL: POLAROID VIEW --- -->
        <div class="modal-overlay" id="polaroidModal" onclick="closePolaroidModal()">
            <div class="polaroid-card">
                <div class="polaroid-img-box">
                    <div style="font-size: 2rem;">🌧️</div>
                </div>
                <div class="polaroid-caption" id="polaroidCaptionText">
                    "จำวันนั้นได้ไหม..."
                </div>
                <div style="font-size: 9px; color: #a0aec0; margin-top: 8px;">(แตะที่นี่เพื่อเก็บความทรงจำ)</div>
            </div>
        </div>

        <!-- --- MODAL: LETTER VIEW --- -->
        <div class="modal-overlay" id="letterModal" onclick="closeLetterModal()">
            <div class="letter-modal-box" onclick="event.stopPropagation()">
                <p style="text-align: right; font-size: 0.8rem; color: #718096; margin-bottom: 8px;">ซองจดหมายสีเก่า</p>
                <div class="letter-content" id="letterTypewriterBox"></div>
                <div style="margin-top: 20px; text-align: right;">
                    <button class="glow-btn" style="padding: 6px 18px; font-size: 0.85rem; margin:0;" onclick="closeLetterModal()">พับเก็บจดหมาย</button>
                </div>
            </div>
        </div>

        <!-- --- WINDOW FRAME BORDER OVERLAY (ให้ความรู้สึกเหมือนมองผ่านหน้าต่างจริง) --- -->
        <div class="window-frame-border">
            <div class="window-pane-divider-v"></div>
        </div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let discoveredCount = 0;
        let isStoryStarted = false;
        const totalMemories = 4;
        let discoveredFlags = { window: false, cafe: false, coffee: false, letter: false };

        // --- START STORY ---
        function startStory() {
            const intro = document.getElementById('intro-screen');
            intro.classList.add('hide');
            isStoryStarted = true;
            
            // แสดงข้อความเริ่มต้นเบาๆ
            setTimeout(() => {
                showHud("ข้างนอกฝนตกหนักเลย... ลองแตะสิ่งของรอบตัวเพื่อดูความรู้สึกที่ซ่อนอยู่สิ");
            }, 600);
        }

        // --- HUD CONTROLLER ---
        function showHud(text) {
            const hud = document.getElementById('storyHud');
            const hudText = document.getElementById('hudText');
            hudText.innerText = text;
            hud.classList.add('show');
        }

        function closeHud() {
            document.getElementById('storyHud').classList.remove('show');
        }

        // --- OBJECT TRIGGER ROUTER ---
        function triggerObject(type) {
            if (!isStoryStarted) return;

            if (type === 'window') {
                markDiscovered('window');
                openPolaroid("หน้าต่างอุ่นๆ", "ฝนตกแบบนี้ เปียกหรือเปล่า อย่าลืมพกร่มนะ");
            } else if (type === 'cafe') {
                markDiscovered('cafe');
                openPolaroid("ร้านกาแฟที่เราเคยนั่ง", "รู้ไหม... ที่เราทักไปหาแกก่อน");
            } else if (type === 'coffee') {
                markDiscovered('coffee');
                openPolaroid("แก้วกาแฟอุ่นในมือ", "เพราะเราแอบชอบแก...");
            } else if (type === 'letter') {
                markDiscovered('letter');
                openLetterModal();
            }
        }

        function markDiscovered(key) {
            if (!discoveredFlags[key]) {
                discoveredFlags[key] = true;
                discoveredCount++;
                document.getElementById('progressIndicator').innerText = `ความทรงจำ ${discoveredCount}/${totalMemories}`;
                
                if (discoveredCount === totalMemories) {
                    setTimeout(triggerFinalScene, 1500);
                }
            }
        }

        // --- POLAROID MODAL ---
        function openPolaroid(captionTitle, captionText) {
            document.getElementById('polaroidCaptionText').innerHTML = `"${captionText}"`;
            document.getElementById('polaroidModal').classList.add('show');
        }

        function closePolaroidModal() {
            document.getElementById('polaroidModal').classList.remove('show');
        }

        // --- LETTER TYPEWRITER MODAL ---
        const letterFullText = "ถึง เธอ...\n\nเราไม่รู้ว่าจะพูดยังไงดี\nแต่จริง ๆ แล้ว...\nเราแอบชอบแกมาตั้งแต่ครั้งแรกเลยนะ ❤️";
        
        function openLetterModal() {
            document.getElementById('letterModal').classList.add('show');
            startTypewriterLetter();
        }

        function closeLetterModal() {
            document.getElementById('letterModal').classList.remove('show');
            markDiscovered('letter');
        }

        function startTypewriterLetter() {
            const box = document.getElementById('letterTypewriterBox');
            box.innerHTML = "";
            let idx = 0;
            
            function type() {
                if (idx < letterFullText.length) {
                    box.innerHTML += letterFullText.charAt(idx) === '\n' ? '<br>' : letterFullText.charAt(idx);
                    idx++;
                    setTimeout(type, 65);
                }
            }
            type();
        }

        // --- FINAL SCENE (SUNSET TRANSITION) ---
        function triggerFinalScene() {
            // เปลี่ยนฉากหลังเป็นท้องฟ้ายามเย็น (Sunset)
            document.getElementById('worldScene').classList.add('sunset');
            
            setTimeout(() => {
                showHud("ฝนหยุดแล้ว... ท้องฟ้าเปลี่ยนเป็นสีอุ่น ความรู้สึกทั้งหมดก็ชัดเจนขึ้น ❤️");
            }, 1000);
        }

        // --- CANVAS RAIN ANIMATION ---
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let raindrops = [];
        const dropCount = 50;
        for (let i = 0; i < dropCount; i++) {
            raindrops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 18 + 8,
                speed: Math.random() * 6 + 6,
                opacity: Math.random() * 0.35 + 0.15
            });
        }

        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1.2;

            for (let drop of raindrops) {
                ctx.strokeStyle = `rgba(180, 210, 245, ${drop.opacity})`;
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 0.8, drop.y + drop.length);
                ctx.stroke();

                drop.y += drop.speed;
                drop.x -= 0.4;

                if (drop.y > canvas.height) {
                    drop.y = -15;
                    drop.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(animateRain);
        }
        animateRain();

        // --- AUDIO AMBIENCE SIMULATOR (Web Audio API) ---
        let audioCtx = null;
        let noiseNode = null;
        let isAudioPlaying = false;

        function toggleAudio() {
            const btn = document.getElementById('audioToggleBtn');
            if (!isAudioPlaying) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 2;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    noiseNode = audioCtx.createBufferSource();
                    noiseNode.buffer = buffer;
                    noiseNode.loop = true;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 650;

                    const gain = audioCtx.createGain();
                    gain.gain.value = 0.12;

                    noiseNode.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    noiseNode.start();
                    isAudioPlaying = true;
                    btn.innerText = "🔇 ปิดเสียงฝน";
                } catch(e) {
                    console.log("Audio Context blocked or not supported", e);
                }
            } else {
                if (noiseNode) noiseNode.stop();
                if (audioCtx) audioCtx.close();
                isAudioPlaying = false;
                btn.innerText = "🔊 เสียงฝน";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Photo - Sunset Chat Reveal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0b0b0b;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ฉากหลังพระอาทิตย์ตกริมทะเล */
        .scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #2b1035, #7a3b49, #d97743, #f3c68f);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 1s ease;
        }

        /* ฟิล์มเกรน (Film Grain) */
        .film-grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1000_Hz_noise.gif');
            opacity: 0.04;
            pointer-events: none;
            z-index: 10;
        }

        /* เสียงคลื่นเบาๆ (ซ่อน audio element ไว้) */
        #wave-audio {
            display: none;
        }

        /* พาร์ทิเคิลสีทอง */
        .particle {
            position: absolute;
            background: radial-gradient(circle, #fff7d6 0%, rgba(255, 215, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
            z-index: 2;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-20vh) translateX(50px);
                opacity: 0;
            }
        }

        /* Background พื้นทรายด้านล่างและผ้าปู */
        .beach-ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, #b88653, #d2a679, rgba(210, 166, 121, 0));
            z-index: 1;
        }

        /* ผ้าปูชายหาด */
        .beach-mat {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%) rotateX(60deg);
            width: 220px;
            height: 140px;
            background: #e8d7c1;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* รูปถ่ายโพลารอยด์บนฉาก (ตำแหน่งเริ่มต้น) */
        .polaroid-frame {
            position: absolute;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            background: #fff;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 3;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 3px;
        }

        .polaroid-frame img {
            width: 100%;
            display: block;
            border-bottom: 1px solid #eee;
        }

        /* เครื่องหมายหัวใจเหนือรูปเมื่อเปิดแล้ว */
        .opened-heart-badge {
            position: absolute;
            bottom: 38%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 24px;
            color: #ff4d6d;
            z-index: 4;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .opened-heart-badge.show {
            transform: translateX(-50%) scale(1);
        }

        /* เมื่อฉากหลังเบลอ */
        .scene-container.blurred {
            filter: blur(6px);
        }

        /* คอนเทนต์เมื่อคลิกเปิดความทรงจำ */
        .memory-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .memory-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* รูปโพลารอยด์ตอนขยายขึ้นตรงกลาง */
        .memory-polaroid {
            width: 180px;
            background: #fff;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-radius: 4px;
            transform: scale(0.5) translateY(50px);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .memory-overlay.active .memory-polaroid {
            transform: scale(1) translateY(0);
        }

        .memory-polaroid img {
            width: 100%;
            display: block;
        }

        /* แสงสีทองส่องผ่านรูป */
        .sun-glow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 20%, rgba(255, 215, 0, 0.4) 0%, rgba(255, 140, 0, 0) 70%);
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* หัวใจลอยขึ้นมาตอนเปิด */
        .floating-heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: floatUpHearts 2s ease-out forwards;
            opacity: 0;
            z-index: 25;
        }

        @keyframes floatUpHearts {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1.2);
                opacity: 0;
            }
        }

        /* กล่องข้อความ */
        .message-box {
            margin-top: 20px;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            max-width: 320px;
            padding: 0 15px;
        }

        .msg-line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .msg-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .msg-line.highlight {
            font-weight: 500;
            color: #ffeb99;
        }

        /* บรรทัดเพิ่มเติมตอนอ่านจบ */
        .extra-msg-line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.5;
            color: #f1f1f1;
            margin-top: 15px;
        }

        .extra-msg-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ปุ่มเก็บความทรงจำ */
        .save-btn {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
            outline: none;
        }

        .save-btn.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- ฉากหลังหลัก (บรรยากาศพระอาทิตย์ตก) -->
    <div class="scene-container" id="scene">
        <div class="film-grain"></div>
        <div class="beach-ground"></div>
        <div class="beach-mat"></div>

        <!-- รูปถ่ายโพลารอยด์ในฉาก (Interactive Object) -->
        <div class="polaroid-frame" id="polaroidObj" onclick="openMemory()">
            <img src="https://i.postimg.cc/MKCVk1Zs/line-oa-chat-261005-131012.jpg" alt="Memory Chat">
        </div>

        <!-- เครื่องหมายหัวใจเหนือรูปเมื่อถูกเก็บความทรงจำแล้ว -->
        <div class="opened-heart-badge" id="heartBadge">❤️</div>
    </div>

    <!-- ส่วนแสดงผลความทรงจำแบบโต้ตอบ (Overlay) -->
    <div class="memory-overlay" id="memoryOverlay">
        <div class="memory-polaroid">
            <div class="sun-glow-overlay"></div>
            <img src="https://i.postimg.cc/MKCVk1Zs/line-oa-chat-261005-131012.jpg" alt="Memory Chat Expanded">
        </div>

        <div class="message-box">
            <div class="msg-line" id="line1">รู้ป้ะ</div>
            <div class="msg-line" id="line2">ที่เราทักไปหาแกก่อน</div>
            <div class="msg-line highlight" id="line3">เพราะเราแอบชอบแก</div>
            <div class="msg-line" id="line4">ในสถานที่แรกกก</div>

            <div class="extra-msg-line" id="line5">
                ตอนนั้นยังไม่รู้เลยว่า<br>
                การทักไปครั้งนั้น<br>
                จะทำให้เรามีความทรงจำเยอะขนาดนี้
            </div>

            <button class="save-btn" id="saveBtn" onclick="closeMemory()">เก็บความทรงจำนี้ไว้ ♡</button>
        </div>
    </div>

    <!-- เสียงคลื่นประกอบบรรยากาศ (สามารถใส่ลิงก์เสียงคลื่นจริงได้ที่ src) -->
    <audio id="wave-audio" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/ocean_waves.ogg" type="audio/ogg">
    </audio>

    <script>
        // สร้าง Particle สีทองลอยอัตโนมัติ
        const scene = document.getElementById('scene');
        for (let i = 0; i < 25; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            const size = Math.random() * 5 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.animationDuration = `${Math.random() * 6 + 4}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            scene.appendChild(particle);
        }

        // ฟังก์ชันเมื่อกดเปิดความทรงจำ
        function openMemory() {
            // เล่นเสียงคลื่น (ถ้าเบราว์เซอร์อนุญาต)
            const audio = document.getElementById('wave-audio');
            audio.play().catch(e => console.log("Audio autoplay restricted:", e));

            // 1 & 3. ฉากหลังเบลอและแสดง Overlay
            document.getElementById('scene').classList.add('blurred');
            document.getElementById('memoryOverlay').classList.add('active');

            // 6. สร้างหัวใจเล็กๆ ลอยขึ้นมา 2-3 ดวง
            createFloatingHearts();

            // 7. แสดงข้อความทีละบรรทัด (Fade-in + Slide-up)
            setTimeout(() => { document.getElementById('line1').classList.add('visible'); }, 400);
            setTimeout(() => { document.getElementById('line2').classList.add('visible'); }, 1000);
            setTimeout(() => { document.getElementById('line3').classList.add('visible'); }, 1600);
            setTimeout(() => { 
                document.getElementById('line4').classList.add('visible'); 
                // แสดงข้อความส่วนที่สองต่อทันทีหลังจากบรรทัดสุดท้ายขึ้น
                setTimeout(() => {
                    document.getElementById('line5').classList.add('visible');
                }, 800);
                // แสดงปุ่มหลังจากข้อความทั้งหมดขึ้นครบ
                setTimeout(() => {
                    document.getElementById('saveBtn').classList.add('visible');
                }, 1600);
            }, 2200);
        }

        // ฟังก์ชันสร้างหัวใจลอย
        function createFloatingHearts() {
            const overlay = document.getElementById('memoryOverlay');
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('floating-heart');
                    heart.innerHTML = '❤️';
                    heart.style.left = `calc(50% + ${(Math.random() - 0.5) * 80}px)`;
                    heart.style.bottom = `35%`;
                    overlay.appendChild(heart);
                    
                    // ลบ element ทิ้งหลังอนิเมชันจบ
                    setTimeout(() => heart.remove(), 2000);
                }, i * 350);
            }
        }

        // เมื่อกดปุ่ม "เก็บความทรงจำนี้ไว้ ♡"
        function closeMemory() {
            // ซ่อน Overlay และยกเลิกการเบลอฉากหลัง
            document.getElementById('scene').classList.remove('blurred');
            document.getElementById('memoryOverlay').classList.remove('active');

            // แสดงสัญลักษณ์หัวใจเหนือรูปในฉากหลัก
            setTimeout(() => {
                document.getElementById('heartBadge').classList.add('show');
            }, 400);

            // รีเซ็ตข้อความให้กลับมาซ่อนไว้เหมือนเดิม (เผื่อกดเข้ามาดูซ้ำ)
            setTimeout(() => {
                const lines = document.querySelectorAll('.msg-line, .extra-msg-line, .save-btn');
                lines.forEach(el => el.classList.remove('visible'));
            }, 600);
        }
    </script>
</body>
</html>

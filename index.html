<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คืนนี้ฝนตกอีกแล้วนะ...</title>
    <!-- Google Fonts: Sarabun สำหรับเนื้อเรื่องทั่วไป และ Caveat สำหรับข้อความลายมือโพลารอยด์ -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Prompt:wght@300;400;500&family=Sarabun:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030509;
            font-family: 'Prompt', sans-serif;
            color: #e2e8f0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mobile Container Ratio 9:16 Frame */
        #app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 880px;
            background: #080c18;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        @media (min-width: 424px) {
            #app-container {
                border-radius: 36px;
                border: 10px solid #1a202c;
                height: 92vh;
            }
        }

        /* --- CAMERA & PARALLAX SCENE SYSTEM --- */
        #camera-rig {
            position: absolute;
            top: 0;
            left: 0;
            width: 220%; /* ขยายความกว้างเพื่อให้กล้อง Pan ซ้าย-ขวาได้ */
            height: 100%;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        /* Parallax Layers */
        .parallax-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
        }

        /* Canvas ฝนและละอองน้ำ */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        /* Film Grain Overlay */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.04"/%3E%3C/svg%3E');
            pointer-events: none;
            z-index: 30;
        }

        /* --- BACKGROUND SKY & WORLD GRADIENT --- */
        .world-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #070b16 0%, #11182c 50%, #191424 100%);
            transition: background 2.5s ease;
            z-index: 1;
        }
        .world-bg.sunset {
            background: linear-gradient(180deg, #2b1428 0%, #5c2d33 40%, #9e4e3b 75%, #d18250 100%);
        }

        /* --- VECTOR CITY ILLUSTRATIONS (CSS / SVG SIMULATION) --- */
        .city-layer {
            position: absolute;
            bottom: 22%;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 3;
        }

        /* Windows with flickering lights */
        .building-window {
            position: absolute;
            background: rgba(246, 173, 85, 0.85);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(246, 173, 85, 0.6);
            animation: windowFlicker 4s infinite alternate;
        }
        @keyframes windowFlicker {
            0% { opacity: 0.7; }
            50% { opacity: 1; filter: drop-shadow(0 0 12px #f6ad55); }
            100% { opacity: 0.6; }
        }

        /* Road & Water Puddle Reflection */
        .road-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(180deg, #0d1222 0%, #05070f 100%);
            border-top: 1px solid rgba(246, 173, 85, 0.25);
            z-index: 5;
        }

        /* Paper Boat Animation */
        #paper-boat {
            position: absolute;
            bottom: 12%;
            left: 35%;
            font-size: 24px;
            z-index: 10;
            cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            animation: boatFloat 3.5s ease-in-out infinite;
            transition: transform 0.3s;
        }
        #paper-boat:hover { transform: scale(1.15); }
        @keyframes boatFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
        }

        /* Steam from Coffee Shop */
        .steam-particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            filter: blur(4px);
            animation: steamRise 3s infinite linear;
            pointer-events: none;
            z-index: 8;
        }
        @keyframes steamRise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-40px) scale(1.6); opacity: 0; }
        }

        /* --- INTERACTIVE HOTSPOTS --- */
        .interactive-obj {
            position: absolute;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .interactive-obj:hover { transform: scale(1.08); }
        .interactive-obj:active { transform: scale(0.95); }

        .pulse-hint {
            animation: hintGlow 2.5s infinite ease-in-out;
        }
        @keyframes hintGlow {
            0%, 100% { filter: drop-shadow(0 0 3px rgba(246,173,85,0.4)); }
            50% { filter: drop-shadow(0 0 12px rgba(246,173,85,0.9)); }
        }

        /* --- STORY HUD DIALOGUE BOX --- */
        .story-hud {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            background: rgba(10, 14, 24, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 16px 20px;
            border-radius: 16px;
            z-index: 50;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.1, 0.9, 0.2, 1);
            pointer-events: none;
        }
        .story-hud.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .story-hud-text {
            font-family: 'Sarabun', sans-serif;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f1f5f9;
            text-align: center;
            min-height: 45px;
        }
        .story-hud-close {
            display: block;
            margin: 10px auto 0 auto;
            background: none;
            border: none;
            color: #f6ad55;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* --- MODALS (POLAROID & LETTER) --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 10, 0.8);
            backdrop-filter: blur(8px);
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Polaroid */
        .polaroid-card {
            background: #fdfbf7;
            padding: 16px 16px 42px 16px;
            width: 270px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            transform: scale(0.7) rotate(-6deg);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            color: #2d3748;
            text-align: center;
        }
        .modal-overlay.show .polaroid-card {
            transform: scale(1) rotate(-2.5deg);
        }
        .polaroid-card::before {
            content: '';
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%);
            width: 70px; height: 22px;
            background: rgba(255, 255, 255, 0.65);
            border-left: 2px dashed rgba(0,0,0,0.15);
            border-right: 2px dashed rgba(0,0,0,0.15);
        }
        .polaroid-img-box {
            width: 100%; height: 180px;
            background: #232d42;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem;
        }
        .polaroid-caption {
            margin-top: 14px;
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #4a5568;
        }

        /* Letter Box */
        .letter-modal-box {
            width: 310px;
            background: #f4eee1;
            padding: 28px 22px;
            border-radius: 4px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            color: #2c2c2c;
            font-family: 'Sarabun', sans-serif;
            position: relative;
            transform: translateY(40px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        .modal-overlay.show .letter-modal-box {
            transform: translateY(0);
            opacity: 1;
        }
        .letter-content {
            font-size: 1.05rem;
            line-height: 1.9;
            white-space: pre-line;
            min-height: 150px;
        }

        /* --- INTRO SCREEN --- */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 17, 0.94);
            z-index: 70;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            transition: opacity 0.8s ease;
        }
        #intro-screen.hide {
            opacity: 0;
            pointer-events: none;
        }
        .glow-btn {
            background: linear-gradient(135deg, #f6ad55, #ed8936);
            color: #111827;
            border: none;
            padding: 14px 36px;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(237, 137, 54, 0.4);
            transition: transform 0.2s;
            margin-top: 25px;
        }
        .glow-btn:active { transform: scale(0.95); }

        /* UI Top bar */
        .top-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 45;
            pointer-events: none;
        }
        .ui-pill {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }
        .audio-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Film Grain Overlay -->
        <div class="grain-overlay"></div>

        <!-- Rain & Ripple Canvas (Continuous Animation) -->
        <canvas id="liveCanvas"></canvas>

        <!-- Top UI Controls -->
        <div class="top-ui">
            <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()">🔊 เสียงฝน</button>
            <div class="ui-pill" id="progressIndicator">ความทรงจำ 0/4</div>
        </div>

        <!-- --- INTRO START SCREEN --- -->
        <div id="intro-screen">
            <p style="font-family: 'Sarabun', sans-serif; font-size: 1.4rem; color: #cbd5e1; margin-bottom: 12px; line-height: 1.8;">
                "คืนนี้ฝนตกอีกแล้วนะ..."
            </p>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 30px; font-weight: 300;">
                แตะสำรวจเมืองเล็กๆ ยามค่ำคืน เพื่อค้นหาความทรงจำที่ซ่อนอยู่
            </p>
            <button class="glow-btn" onclick="startStory()">ก้าวเข้าสู่เรื่องราว</button>
        </div>

        <!-- --- CAMERA RIG & PARALLAX SCENE --- -->
        <div id="camera-rig">
            <!-- WORLD SCENE BACKGROUND -->
            <div class="world-bg" id="worldBg"></div>

            <!-- LAYER 1: City & Buildings (Parallax Slow) -->
            <div class="parallax-layer" data-speed="0.2" style="transform: translateX(0px);">
                <div class="city-layer">
                    <!-- หน้าต่างห้องติดไฟอุ่นๆ -->
                    <div class="building-window pulse-hint" style="top: 25%; left: 12%; width: 45px; height: 65px;" onclick="triggerObject('window')"></div>
                    <div class="building-window" style="top: 35%; left: 32%; width: 35px; height: 50px;"></div>
                    <div class="building-window" style="top: 20%; left: 58%; width: 40px; height: 60px;"></div>
                    <!-- ร้านกาแฟ -->
                    <div class="building-window pulse-hint" style="top: 40%; left: 78%; width: 70px; height: 45px; background: rgba(237,137,54,0.7);" onclick="triggerObject('cafe')"></div>
                </div>
            </div>

            <!-- LAYER 2: Foreground Street & Interactive Objects (Parallax Normal) -->
            <div class="parallax-layer" data-speed="0.5" style="transform: translateX(0px);">
                <div class="road-layer"></div>

                <!-- Paper Boat (Interactive Object 1) -->
                <div id="paper-boat" class="pulse-hint" onclick="triggerObject('boat')" title="เรือกระดาษ">
                    ⛵
                </div>

                <!-- Polaroid Photo on Ground (Interactive Object 2) -->
                <div class="interactive-obj pulse-hint" style="bottom: 15%; left: 62%; width: 45px; height: 55px; background: #fdfbf7; border-radius: 2px; padding: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.6); transform: rotate(12deg);" onclick="triggerObject('photo')">
                    <div style="width: 100%; height: 35px; background: #232d42; display:flex; align-items:center; justify-content:center; font-size:12px;">🖼️</div>
                </div>

                <!-- Envelope on Ground (Interactive Object 3) -->
                <div class="interactive-obj pulse-hint" style="bottom: 12%; left: 88%; width: 50px; height: 35px; background: #f4eee1; border-radius: 3px; box-shadow: 0 4px 10px rgba(0,0,0,0.6);" onclick="triggerObject('letter')">
                    <div style="font-size: 8px; color: #333; text-align: center; margin-top: 10px; font-weight: bold;">💌 จดหมาย</div>
                </div>
            </div>
        </div>

        <!-- --- STORY HUD DIALOGUE BOX --- -->
        <div class="story-hud" id="storyHud">
            <div class="story-hud-text" id="hudText">ข้อความเรื่องราว...</div>
            <button class="story-hud-close" onclick="closeHud()">แตะเพื่อปิดและสำรวจต่อ ➔</button>
        </div>

        <!-- --- MODAL: POLAROID VIEW --- -->
        <div class="modal-overlay" id="polaroidModal" onclick="closePolaroidModal()">
            <div class="polaroid-card">
                <div class="polaroid-img-box" id="polaroidEmoji">📸</div>
                <div class="polaroid-caption" id="polaroidCaptionText">"จำวันนั้นได้ไหม..."</div>
                <div style="font-size: 9px; color: #a0aec0; margin-top: 8px;">(แตะเพื่อปิด)</div>
            </div>
        </div>

        <!-- --- MODAL: LETTER VIEW --- -->
        <div class="modal-overlay" id="letterModal" onclick="closeLetterModal()">
            <div class="letter-modal-box" onclick="event.stopPropagation()">
                <p style="text-align: right; font-size: 0.8rem; color: #718096; margin-bottom: 8px;">ซองจดหมายสีเก่า</p>
                <div class="letter-content" id="letterTypewriterBox"></div>
                <div style="margin-top: 20px; text-align: right;">
                    <button class="glow-btn" style="padding: 6px 18px; font-size: 0.85rem; margin:0;" onclick="closeLetterModal()">พับเก็บจดหมาย</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- APP STATE ---
        let isStarted = false;
        let discoveredCount = 0;
        const totalMemories = 4;
        let discoveredFlags = { window: false, cafe: false, boat: false, photo: false, letter: false };
        let currentCameraPos = 0; // ตำแหน่งกล้องปัจจุบัน (px)

        // --- START STORY ---
        function startStory() {
            document.getElementById('intro-screen').classList.add('hide');
            isStarted = true;
            setTimeout(() => {
                showHud("ข้างนอกฝนตกหนักเลย... ลองแตะสิ่งของในเมืองเพื่อค้นหาความรู้สึกที่ซ่อนอยู่");
            }, 600);
        }

        // --- HUD CONTROLLER ---
        function showHud(text) {
            document.getElementById('hudText').innerText = text;
            document.getElementById('storyHud').classList.add('show');
        }

        function closeHud() {
            document.getElementById('storyHud').classList.remove('show');
        }

        // --- CAMERA PAN & PARALLAX SYSTEM ---
        function panCameraTo(targetX) {
            currentCameraPos = targetX;
            const rig = document.getElementById('camera-rig');
            rig.style.transform = `translateX(${targetX}px)`;

            // Parallax calculation for layers
            const layers = document.querySelectorAll('.parallax-layer');
            layers.forEach(layer => {
                const speed = parseFloat(layer.getAttribute('data-speed'));
                layer.style.transform = `translateX(${-targetX * speed}px)`;
            });
        }

        // --- OBJECT INTERACTION ROUTER ---
        function triggerObject(type) {
            if (!isStarted) return;

            if (type === 'window') {
                panCameraTo(0);
                markDiscovered('window');
                openPolaroid("🏠 หน้าต่างอุ่นๆ", "ฝนตกแบบนี้ เปียกหรือเปล่า อย่าลืมพกร่มนะ");
            } else if (type === 'cafe') {
                panCameraTo(-120);
                markDiscovered('cafe');
                openPolaroid("☕ ร้านกาแฟ", "รู้ไหม... ที่เราทักไปหาแกก่อน");
            } else if (type === 'boat') {
                panCameraTo(-60);
                markDiscovered('boat');
                openPolaroid("⛵ เรือกระดาษ", "เพราะเราแอบชอบแก...");
            } else if (type === 'photo') {
                panCameraTo(-180);
                markDiscovered('photo');
                openPolaroid("✨ รูปถ่ายความทรงจำ", "ตั้งแต่ครั้งแรกที่เจอเลยนะ");
            } else if (type === 'letter') {
                panCameraTo(-220);
                markDiscovered('letter');
                openLetterModal();
            }
        }

        function markDiscovered(key) {
            if (!discoveredFlags[key]) {
                discoveredFlags[key] = true;
                discoveredCount = Math.min(totalMemories, discoveredCount + 1);
                document.getElementById('progressIndicator').innerText = `ความทรงจำ ${discoveredCount}/${totalMemories}`;

                if (discoveredCount === totalMemories) {
                    setTimeout(triggerFinalScene, 1800);
                }
            }
        }

        // --- MODAL POPUPS ---
        function openPolaroid(emoji, caption) {
            document.getElementById('polaroidEmoji').innerText = emoji;
            document.getElementById('polaroidCaptionText').innerText = `"${caption}"`;
            document.getElementById('polaroidModal').classList.add('show');
        }
        function closePolaroidModal() {
            document.getElementById('polaroidModal').classList.remove('show');
        }

        const letterFullText = "ถึง เธอ...\n\nเราไม่รู้ว่าจะพูดยังไงดี\nแต่จริง ๆ แล้ว...\nเราแอบชอบแกมานานแล้วนะ ❤️";
        function openLetterModal() {
            document.getElementById('letterModal').classList.add('show');
            startTypewriterLetter();
        }
        function closeLetterModal() {
            document.getElementById('letterModal').classList.remove('show');
            markDiscovered('letter');
        }
        function startTypewriterLetter() {
            const box = document.getElementById('letterTypewriterBox');
            box.innerHTML = "";
            let idx = 0;
            function type() {
                if (idx < letterFullText.length) {
                    box.innerHTML += letterFullText.charAt(idx) === '\n' ? '<br>' : letterFullText.charAt(idx);
                    idx++;
                    setTimeout(type, 60);
                }
            }
            type();
        }

        // --- FINAL SCENE (SUNSET TRANSITION) ---
        function triggerFinalScene() {
            document.getElementById('worldBg').classList.add('sunset');
            setTimeout(() => {
                showHud("ฝนหยุดแล้ว... ท้องฟ้าเปลี่ยนเป็นสีอุ่น ความรู้สึกทั้งหมดชัดเจนขึ้นแล้ว ❤️");
            }, 1200);
        }

        // --- CONTINUOUS LIVE CANVAS ANIMATION (RAIN, RIPPLES & PARTICLES) ---
        const canvas = document.getElementById('liveCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Rain particles
        let raindrops = [];
        const maxDrops = 80;
        for (let i = 0; i < maxDrops; i++) {
            raindrops.push({
                x: Math.random() * canvas.width * 1.5,
                y: Math.random() * canvas.height,
                length: Math.random() * 20 + 10,
                speed: Math.random() * 8 + 7,
                opacity: Math.random() * 0.4 + 0.15
            });
        }

        // Water ripples on ground road
        let ripples = [];
        function addRipple() {
            if (ripples.length < 15) {
                ripples.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height * 0.78 + Math.random() * (canvas.height * 0.2),
                    radius: 2,
                    maxRadius: Math.random() * 15 + 10,
                    opacity: 0.6
                });
            }
        }
        setInterval(addRipple, 400);

        function animateWorld() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Rain
            ctx.lineWidth = 1.2;
            for (let drop of raindrops) {
                ctx.strokeStyle = `rgba(180, 215, 250, ${drop.opacity})`;
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 0.6, drop.y + drop.length);
                ctx.stroke();

                drop.y += drop.speed;
                drop.x -= 0.3;

                if (drop.y > canvas.height) {
                    drop.y = -20;
                    drop.x = Math.random() * canvas.width * 1.5;
                }
            }

            // 2. Draw Ripples on road
            for (let i = ripples.length - 1; i >= 0; i--) {
                let r = ripples[i];
                ctx.strokeStyle = `rgba(246, 173, 85, ${r.opacity * 0.4})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.ellipse(r.x, r.y, r.radius, r.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.stroke();

                r.radius += 0.4;
                r.opacity -= 0.02;

                if (r.opacity <= 0 || r.radius >= r.maxRadius) {
                    ripples.splice(i, 1);
                }
            }

            requestAnimationFrame(animateWorld);
        }
        animateWorld();

        // --- AUDIO AMBIENCE SIMULATOR (Web Audio API) ---
        let audioCtx = null;
        let noiseNode = null;
        let isAudioPlaying = false;

        function toggleAudio() {
            const btn = document.getElementById('audioToggleBtn');
            if (!isAudioPlaying) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const bufferSize = audioCtx.sampleRate * 2;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    noiseNode = audioCtx.createBufferSource();
                    noiseNode.buffer = buffer;
                    noiseNode.loop = true;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 600;

                    const gain = audioCtx.createGain();
                    gain.gain.value = 0.12;

                    noiseNode.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    noiseNode.start();
                    isAudioPlaying = true;
                    btn.innerText = "🔇 ปิดเสียงฝน";
                } catch(e) {
                    console.log("Audio Context blocked", e);
                }
            } else {
                if (noiseNode) noiseNode.stop();
                if (audioCtx) audioCtx.close();
                isAudioPlaying = false;
                btn.innerText = "🔊 เสียงฝน";
            }
        }
    </script>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* หัวใจลอยเป็นแบ็กกราวด์ */
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            font-size: 24px;
            user-select: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            color: #d84351;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 20px;
        }

        .photo-frame {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 8px 20px rgba(216, 67, 81, 0.2);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-box {
            font-size: 1rem;
            line-height: 1.8;
            color: #666;
            margin-bottom: 30px;
            background: #fff5f6;
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed #ffa6b0;
        }

        .counter {
            font-size: 1.1rem;
            font-weight: 600;
            color: #d84351;
            margin-bottom: 25px;
            background: #ffebee;
            padding: 10px;
            border-radius: 10px;
        }

        .btn-surprise {
            background: linear-gradient(135deg, #ff6b81 0%, #ff4757 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        .btn-surprise:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        /* ป๊อปอัพซ่อนข้อความพิเศษ */
        .hidden-popup {
            display: none;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #d84351;
            font-weight: 500;
            animation: fadeIn 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Anniversary</h1>
        <h2>รักเธอนะคะ/ครับคนดี ❤️</h2>

        <!-- กรอบรูปคู่ (สามารถเปลี่ยนลิงก์รูปภาพตรง src ได้เลย) -->
        <div class="photo-frame">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80" alt="Our Photo">
        </div>

        <!-- ตัวนับเวลาที่คบกัน -->
        <div class="counter" id="counter">
            คบกันมาแล้ว: กำลังคำนวณ...
        </div>

        <!-- ข้อความบอกความในใจ -->
        <div class="message-box">
            "ขอบคุณที่อยู่ข้างกันและสร้างความทรงจำที่ดีร่วมกันมาตลอดนะ ดีใจที่มีเธอในทุกๆ วัน ขอให้เราจับมือกันแบบนี้ไปนานๆ เลยนะตัวเล็ก"
        </div>

        <button class="btn-surprise" onclick="showSecret()">กดเพื่อดูความลับ 💌</button>
        
        <div class="hidden-popup" id="secretText">
            เย้! รักแฟนที่สุดในโลกเลย อยู่ด้วยกันไปนานๆ น้าาา 💖✨
        </div>
    </div>

    <script>
        // --- 1. ตั้งค่าวันที่เริ่มคบกัน (ปี, เดือน(0-11), วัน) ---
        // เช่น เริ่มคบวันที่ 14 กุมภาพันธ์ 2024 ให้ใส่ (2024, 1, 14)
        const startDate = new Date(2024, 1, 14); 

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);

            document.getElementById('counter').innerHTML = 
                `เรารักกันมา <b>${days}</b> วัน <b>${hours}</b> ชม. <b>${minutes}</b> นาทีแล้วนะ 🥰`;
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        // --- 2. ฟังก์ชันกดปุ่มแสดงข้อความลับ ---
        function showSecret() {
            const secret = document.getElementById('secretText');
            secret.style.display = secret.style.display === 'block' ? 'none' : 'block';
        }

        // --- 3. เอฟเฟกต์หัวใจลอยขึ้นอัตโนมัติ ---
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>

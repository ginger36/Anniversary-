<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sunset Journey ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 50%, #ff6a88 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* หน้าแรก (Landing Page) */
        #welcome-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 126, 95, 0.95), rgba(254, 180, 123, 0.95));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        #welcome-screen h1 {
            font-family: 'Sacramento', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        #welcome-screen p {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .btn-start {
            background: #fff;
            color: #ff6a88;
            border: none;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .btn-start:hover {
            transform: translateY(-3px);
            background: #fff5f6;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        /* หน้าจอหลัก (ฉากเมืองยามพระอาทิตย์ตก) */
        #main-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 850px;
            background: linear-gradient(to bottom, #2c1654 0%, #783853 40%, #e07a5f 70%, #f4f1de 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            border-radius: 30px;
        }

        /* ตึกและฉากหลัง */
        .city-skyline {
            position: absolute;
            bottom: 35%;
            width: 100%;
            height: 45%;
            background-image: url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=600&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.25;
            z-index: 1;
        }

        /* สายน้ำยามเย็น */
        .river {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 38%;
            background: linear-gradient(to bottom, #1d3557, #112233);
            z-index: 2;
            border-top: 4px solid rgba(255, 255, 255, 0.2);
        }

        /* ระลอกคลื่นน้ำ */
        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: ripple 3s infinite linear;
        }

        @keyframes ripple {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }

        /* เส้นทางการเดินทางของเรือ (Path) */
        .path-line {
            position: absolute;
            bottom: 20%;
            left: 10%;
            width: 80%;
            height: 2px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.4);
            z-index: 3;
        }

        /* จุดเช็คอินบนเส้นทาง */
        .checkpoint {
            position: absolute;
            bottom: 18.5%;
            transform: translateX(-50%);
            z-index: 4;
            text-align: center;
            cursor: pointer;
        }

        .checkpoint-dot {
            width: 16px;
            height: 16px;
            background: #ffb703;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffb703;
            transition: all 0.3s;
        }

        .checkpoint.active .checkpoint-dot {
            background: #e63946;
            transform: scale(1.3);
            box-shadow: 0 0 15px #e63946;
        }

        .checkpoint-label {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }

        /* เรือกระดาษที่เคลื่อนที่ได้ */
        #paper-boat {
            position: absolute;
            bottom: 19%;
            left: 10%;
            font-size: 2.2rem;
            z-index: 5;
            transform: translateX(-50%);
            transition: left 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4));
        }

        /* โพลารอยด์ความทรงจำ (Pop-up การเดินทาง) */
        #memory-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 20px;
        }

        .polaroid-card {
            background: #fff;
            padding: 20px 20px 30px 20px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 100%;
            text-align: center;
            transform: scale(0.8);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        @keyframes popIn {
            to { transform: scale(1); }
        }

        .polaroid-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .polaroid-text {
            font-size: 0.95rem;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-close-modal {
            background: #ff6a88;
            color: #fff;
            border: none;
            padding: 8px 25px;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close-modal:hover {
            background: #e05370;
        }

        /* แผงควบคุมด้านล่าง */
        .control-panel {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .btn-next-step {
            background: linear-gradient(135deg, #ff7e5f, #ff6a88);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .btn-next-step:active {
            transform: scale(0.95);
        }

        /* หน้าปลายทาง (Destination) */
        #destination-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c1654 0%, #783853 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            padding: 30px;
            text-align: center;
            color: #fff;
            animation: fadeIn 1s ease-in-out;
        }

        #destination-screen h2 {
            font-family: 'Sacramento', cursive;
            font-size: 3rem;
            color: #ffb703;
            margin-bottom: 10px;
        }

        .dest-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
            width: 100%;
        }

        .counter-text {
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffd166;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- หน้าแรก -->
    <div id="welcome-screen">
        <h1>Our Sunset Journey</h1>
        <p>การเดินทางผ่านกาลเวลาและความทรงจำของเรา 🌅</p>
        <button class="btn-start" onclick="startJourney()">กดเพื่อออกเดินทาง ⛵</button>
    </div>

    <!-- หน้าจอหลัก (จำลองมือถือ/หน้าจอเว็บ) -->
    <div id="main-container">
        <div class="city-skyline"></div>
        
        <div class="river">
            <div class="wave"></div>
        </div>

        <!-- เส้นทางและหมุด -->
        <div class="path-line"></div>
        <div id="checkpoints-container"></div>

        <!-- เรือกระดาษเคลื่อนที่ -->
        <div id="paper-boat">⛵</div>

        <!-- แผงควบคุมคลิกเดินทาง -->
        <div class="control-panel">
            <button class="btn-next-step" id="action-btn" onclick="nextCheckpoint()">ออกเดินทางต่อ ➡️</button>
        </div>

        <!-- โมดอลแสดงจดหมายและรูปภาพ -->
        <div id="memory-modal">
            <div class="polaroid-card">
                <img id="modal-img" class="polaroid-img" src="" alt="Memory">
                <p id="modal-text" class="polaroid-text"></p>
                <button class="btn-close-modal" onclick="closeModal()">เก็บลงความทรงจำ ✨</button>
            </div>
        </div>

        <!-- หน้าปลายทาง -->
        <div id="destination-screen">
            <h2>Happy Anniversary ❤️</h2>
            <div class="dest-box">
                <div class="counter-text" id="counter">กำลังคำนวณเวลา...</div>
            </div>
            <div class="dest-box" style="font-size: 0.95kr; line-height: 1.7;">
                "ขอบคุณที่ยอมร่วมทางและสร้างความทรงจำที่อบอุ่นเหมือนพระอาทิตย์ตกดินด้วยกันนะ ขอให้เราเดินทางเคียงข้างกันแบบนี้ไปนานๆ เลยนะคนดี" 🌅💖
            </div>
        </div>
    </div>

    <script>
        // ข้อมูลจุดเช็คอินความทรงจำระหว่างทาง (สามารถปรับเปลี่ยนข้อความและลิงก์รูปภาพได้ตามใจชอบ)
        const milestones = [
            {
                title: "จุดที่ 1: ท่าน้ำริมคลอง",
                text: "“จำวันที่เราไปนั่งคุยกันริมน้ำตอนเย็นได้ไหม? ท้องฟ้าสวยมาก แต่รอยยิ้มเธอสวยกว่านั้นอีกนะ”",
                img: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80",
                position: 25 // เปอร์เซ็นต์ความกว้าง
            },
            {
                title: "จุดที่ 2: ร้านกาแฟอบอุ่น",
                text: "“โกโก้อุ่นๆ กับเสียงฝนตกเบาๆ วันนั้น ทำให้รู้ว่าการมีเธออยู่ข้างๆ มันอุ่นใจแค่ไหน”",
                img: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=500&q=80",
                position: 50
            },
            {
                title: "จุดที่ 3: ร้านก๋วยเตี๋ยวเจ้าเก่า",
                text: "“มื้ออร่อยๆ ง่ายๆ ที่มีความสุขที่สุด เพราะเราได้นั่งกินด้วยกันและแย่งกันชิมตลอดเวลา 🍜”",
                img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=500&q=80",
                position: 75
            }
        ];

        let currentIndex = -1;
        const boat = document.getElementById('paper-boat');
        const container = document.getElementById('checkpoints-container');
        const actionBtn = document.getElementById('action-btn');
        const modal = document.getElementById('memory-modal');
        const modalImg = document.getElementById('modal-img');
        const modalText = document.getElementById('modal-text');
        const destScreen = document.getElementById('destination-screen');

        // สร้างหมุดปักบนแผนที่
        milestones.forEach((m, index) => {
            const cp = document.createElement('div');
            cp.className = 'checkpoint';
            cp.style.left = m.position + '%';
            cp.innerHTML = `
                <div class="checkpoint-dot" id="dot-${index}"></div>
                <div class="checkpoint-label">${m.title.split(':')[0]}</div>
            `;
            container.appendChild(cp);
        });

        function startJourney() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
            }, 800);
            nextCheckpoint();
        }

        function nextCheckpoint() {
            currentIndex++;

            if (currentIndex < milestones.length) {
                const target = milestones[currentIndex];
                
                // ขยับเรือไปตำแหน่งใหม่
                boat.style.left = target.position + '%';
                
                // เปลี่ยนสถานะจุดเช็คอิน
                document.getElementById(`dot-${currentIndex}`).parentElement.classList.add('active');

                // รอให้เรือแล่นไปถึงแล้วเด้งรูปความทรงจำขึ้นมา
                setTimeout(() => {
                    modalImg.src = target.img;
                    modalText.innerHTML = `<b>${target.title}</b><br><br>${target.text}`;
                    modal.style.display = 'flex';
                }, 1200);

                if (currentIndex === milestones.length - 1) {
                    actionBtn.innerHTML = "เดินทางสู่ปลายทาง 🌅";
                } else {
                    actionBtn.innerHTML = "เดินทางไปจุดถัดไป ➡️";
                }
            } else {
                // ถึงปลายทาง
                boat.style.left = '92%';
                setTimeout(() => {
                    destScreen.style.display = 'flex';
                    startCounter();
                }, 1000);
            }
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // --- ตั้งค่าวันที่เริ่มคบกัน (ปี, เดือน(0-11), วัน) ---
        const startDate = new Date(2024, 1, 14); 

        function startCounter() {
            function updateCounter() {
                const now = new Date();
                const diff = now - startDate;
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById('counter').innerHTML = 
                    `เรารักกันมาแล้ว <br><b style="font-size: 1.3rem; color: #fff;">${days}</b> วัน <b style="font-size: 1.3rem; color: #fff;">${hours}</b> ชม. <b style="font-size: 1.3rem; color: #fff;">${minutes}</b> นาที <b style="font-size: 1.3rem; color: #fff;">${seconds}</b> วินาที 🥰`;
            }
            setInterval(updateCounter, 1000);
            updateCounter();
        }
    </script>
</body>
</html>
